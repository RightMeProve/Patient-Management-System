# ============================================================================
# APPLICATION PROPERTIES — SPRING BOOT CONFIGURATION
# ============================================================================
# Spring Boot reads this file at startup to configure the application.
# Located at src/main/resources/ (on the classpath by default).

# --- APPLICATION IDENTITY ---
# Names this microservice. Used in logging, metrics, and service discovery.
spring.application.name=patient-service


#-----------------------Uncomment to User IN memory database Outside Docker ------------------------
## --- H2 IN-MEMORY DATABASE ---
## H2 is a lightweight, in-memory Java database. Perfect for dev/testing.
## No installation required — runs inside the JVM.
#
## Path to H2 web console: http://localhost:4000/h2-console
#spring.h2.console.path = /h2-console
#
## JDBC URL: "mem:" = in-memory (data lost on restart). "testdb" = DB name.
## FOR PRODUCTION: jdbc:postgresql://localhost:5432/patient_db
#spring.datasource.url = jdbc:h2:mem:testdb
#
## JDBC driver class. Spring can auto-detect, but explicit is clearer.
#spring.datasource.driver-class-name = org.h2.Driver
#
## DB credentials. In production, use env vars: ${DB_USERNAME}, ${DB_PASSWORD}
#spring.datasource.username = admin_viewer
#spring.datasource.password = password
#
## --- JPA / HIBERNATE ---
#
## Dialect tells Hibernate the target DB's SQL "language" (syntax differences).
#spring.jpa.database-platform = org.hibernate.dialect.H2Dialect
#
## DDL-AUTO options: none | validate | update | create | create-drop
## "update" adds new columns/tables but never drops — safe for dev.
## FOR PRODUCTION: use "validate" + Flyway/Liquibase for migrations.
#spring.jpa.hibernate.ddl-auto = update
#
## "always" runs data.sql on every startup (needed for in-memory DB re-seeding).
#spring.sql.init.mode = always

#------------------------------------------------------------------------------------

# --- SERVER ---
# Custom port 4000 (default 8080). Each microservice uses a different port.
server.port = 4000

# --- LOGGING ---
# Levels: TRACE < DEBUG < INFO < WARN < ERROR. "info" shows INFO and above.
logging.level.root = info


spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
